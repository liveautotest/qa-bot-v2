id: TC-CONTRACT-001
name: 게스트 계약 요청
platform: aos
env: staging
role: guest
slack_command: "!게스트 계약 요청"
aliases:
  - "!게스트 계약요청"
runner:
  test: contract-request
  implementation: src/tests/contract-request.test.js
preconditions:
  - ADB_GUEST_DEVICE 단말이 연결되어 있어야 한다.
  - 스테이징 앱이 단말에 설치되어 있어야 한다.
  - 게스트 계정으로 로그인되어 있어야 한다.
  - 계약 요청 테스트는 앱을 완전히 종료한 뒤 재실행해서 시작한다.
  - 검색 조건은 정확한 일정 2026년 8월 1일부터 2026년 8월 7일까지를 사용한다.
steps:
  - id: CONTRACT-GUEST-01
    action: wake_device
    description: 단말 화면을 깨우고 잠금 해제를 시도한다.
    expected: 앱 조작이 가능한 상태가 된다.
  - id: CONTRACT-GUEST-02
    action: force_stop_and_launch_app
    description: 스테이징 앱을 완전히 종료한 뒤 다시 실행한다.
    expected: 검색바가 포함된 홈 화면이 노출된다.
  - id: CONTRACT-GUEST-03
    action: run_exact_schedule_search
    description: 국내, 2026년 8월 1일~8월 7일, 어린이 1명, 유아 1명, 반려동물 1마리 조건으로 검색한다.
    expected: 검색 결과 목록 화면으로 이동한다.
  - id: CONTRACT-GUEST-04
    action: expand_result_sheet
    description: 검색 결과 화면의 리스트 영역을 위로 끌어올린다.
    expected: 숙소 카드 목록이 화면에 노출된다.
  - id: CONTRACT-GUEST-05
    action: open_first_listing
    description: 검색 결과 목록에서 임의의 계약 가능한 숙소 카드를 선택한다.
    expected: 숙소 상세 화면으로 이동한다.
  - id: CONTRACT-GUEST-06
    action: tap_contract_condition
    description: 숙소 상세 화면 하단의 계약 조건 확인 버튼을 누른다.
    expected: 계약 상세 화면으로 이동한다.
  - id: CONTRACT-GUEST-07
    action: fill_pet_info
    description: 반려동물 정보 입력란에 리트리버를 입력한다.
    expected: 계약 상세 화면에서 반려동물 정보 입력값이 확인된다.
  - id: CONTRACT-GUEST-08
    action: agree_required_terms
    description: 계약 상세 화면 하단으로 스크롤한 뒤 필수 약관 전체 동의를 선택한다.
    expected: 필수 약관 동의 상태가 된다.
  - id: CONTRACT-GUEST-09
    action: submit_contract_request
    description: 하단의 파란 계약 요청하기 버튼을 누른다.
    expected: 계약 요청 완료 화면으로 이동한다.
  - id: CONTRACT-GUEST-10
    action: return_home
    description: 계약 요청 완료 화면에서 홈으로 버튼을 누른다.
    expected: 홈 화면으로 복귀한다.
validations:
  - id: CONTRACT-GUEST-V01
    description: 앱 재실행 후 홈 검색바가 확인되지 않으면 FAIL 처리한다.
  - id: CONTRACT-GUEST-V02
    description: 정확한 일정 검색 결과 목록이 확인되지 않으면 FAIL 처리한다.
  - id: CONTRACT-GUEST-V03
    description: 검색 결과에서 계약 가능한 숙소 카드를 찾지 못하면 FAIL 처리한다.
  - id: CONTRACT-GUEST-V04
    description: 계약 조건 확인 버튼 또는 계약 상세 화면이 확인되지 않으면 FAIL 처리한다.
  - id: CONTRACT-GUEST-V05
    description: 반려동물 정보 입력란에 리트리버 입력이 확인되지 않으면 FAIL 처리한다.
  - id: CONTRACT-GUEST-V06
    description: 필수 약관 전체 동의와 계약 요청하기 버튼이 확인되지 않으면 FAIL 처리한다.
  - id: CONTRACT-GUEST-V07
    description: 계약 요청 완료 화면과 홈으로 버튼이 확인되지 않으면 FAIL 처리한다.
artifacts:
  screenshots:
    - search-results.png
    - search-results-expanded.png
    - accommodation-detail.png
    - contract-detail-after-pet-info.png
    - contract-detail-terms.png
    - contract-request-after-submit.png
    - contract-request-final.png
  logs:
    - runner.log
    - search-results.xml
    - accommodation-detail.xml
    - contract-detail-after-pet-info.xml
    - contract-detail-terms.xml
    - contract-request-after-submit.xml
    - contract-request-final.xml
pass_criteria:
  - 정확한 일정 검색 결과에서 숙소 상세 화면으로 진입한다.
  - 계약 상세 화면에서 반려동물 정보와 필수 약관 동의를 완료한다.
  - 계약 요청 완료 화면이 확인된다.
  - 홈으로 버튼 선택 후 홈 화면 복귀가 확인된다.
