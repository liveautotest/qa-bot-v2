id: TC-TOSS-DEPOSIT-APPROVE-001
name: 토스 무통장 입금 승인
platform: web-admin
env: toss
role: admin
slack_command: "!무통장 입금 승인"
runner:
  test: toss-deposit-approve
  implementation: src/tests/toss-deposit-approve.test.js
preconditions:
  - 최근 게스트 무통장 결제 테스트가 PASS 상태여야 한다.
  - 로컬 .env에 토스 어드민 URL, MID, 로그인 계정 정보가 설정되어 있어야 한다.
  - Google Chrome이 설치되어 있거나 TOSS_ADMIN_CHROME_PATH가 설정되어 있어야 한다.
steps:
  - id: TOSS-DEPOSIT-01
    action: load_latest_bank_transfer_result
    description: 최근 무통장 결제 PASS 리포트에서 금액, 구매자명, 숙소명, 계약번호 끝자리를 읽는다.
    expected: 토스 테스트 결제내역 매칭 기준이 확인된다.
  - id: TOSS-DEPOSIT-02
    action: open_toss_payment_logs
    description: 토스 개발자센터 테스트 결제내역 페이지에 접속한다.
    expected: 테스트 결제내역 화면이 열린다.
  - id: TOSS-DEPOSIT-03
    action: login_if_needed
    description: 로그인이 필요하면 .env의 토스 어드민 계정으로 로그인한다.
    expected: 결제내역 화면에 접근 가능하다.
  - id: TOSS-DEPOSIT-04
    action: search_mid
    description: 상점 MID liveanjb2c를 입력하고 검색한다.
    expected: 해당 MID의 테스트 결제내역 목록이 노출된다.
  - id: TOSS-DEPOSIT-05
    action: match_waiting_deposit_row
    description: 입금대기 상태, 가상계좌, 금액, 상품명/계약번호가 일치하는 행을 찾는다.
    expected: 입금처리 버튼이 있는 대상 행이 확인된다.
  - id: TOSS-DEPOSIT-06
    action: approve_deposit
    description: 대상 행의 입금처리 버튼을 누른다.
    expected: 같은 기준의 입금대기 행이 사라진다.
validations:
  - id: TOSS-DEPOSIT-V01
    description: 최근 무통장 결제 PASS 결과가 없으면 FAIL 처리한다.
  - id: TOSS-DEPOSIT-V02
    description: 금액, 상품명, 계약번호 끝자리 기준을 확인하지 못하면 FAIL 처리한다.
  - id: TOSS-DEPOSIT-V03
    description: 입금대기가 아닌 행이나 입금처리 버튼이 없는 행은 처리하지 않는다.
  - id: TOSS-DEPOSIT-V04
    description: 입금처리 후 같은 입금대기 행이 남아 있으면 FAIL 처리한다.
artifacts:
  screenshots:
    - 실패 시점 화면만 저장한다.
  logs:
    - toss-deposit-after-approve.html
pass_criteria:
  - 최근 무통장 결제 결과와 매칭되는 토스 입금대기 행을 찾는다.
  - 입금처리 버튼을 누른다.
  - 같은 매칭 기준의 입금대기 행이 더 이상 보이지 않는다.
