id: TC-CONTRACT-APPROVE-001
name: 호스트 계약 승인
platform: aos
env: staging
role: host
slack_command: "!호스트 계약 승인"
runner:
  test: contract-approve
  implementation: src/tests/contract-approve.test.js
preconditions:
  - ADB_HOST_DEVICE 단말이 연결되어 있어야 한다.
  - 스테이징 앱이 단말에 설치되어 있어야 한다.
  - 호스트 계정으로 로그인되어 있고 호스트모드에 진입 가능해야 한다.
  - 게스트 계약 요청으로 승인 가능한 계약 요청 건이 존재해야 한다.
steps:
  - id: APPROVE-HOST-01
    action: wake_device
    description: 단말 화면을 깨우고 잠금 해제를 시도한다.
    expected: 앱 조작이 가능한 상태가 된다.
  - id: APPROVE-HOST-02
    action: force_stop_and_launch_app
    description: 스테이징 앱을 완전히 종료한 뒤 다시 실행한다.
    expected: 호스트모드 하단 탭이 노출된다.
  - id: APPROVE-HOST-03
    action: open_contract_tab
    description: 호스트모드 하단 계약 탭으로 이동한다.
    expected: 계약 관리 목록이 노출된다.
  - id: APPROVE-HOST-04
    action: select_contract_request
    description: 계약 요청 상태의 가장 최근 계약 카드를 선택한다.
    expected: 계약 요청 상세 화면이 노출된다.
  - id: APPROVE-HOST-05
    action: tap_accept_contract
    description: 계약 수락 버튼을 누른다.
    expected: 계약 승인 확인 또는 승인 완료 상태로 이동한다.
  - id: APPROVE-HOST-06
    action: verify_contract_approved
    description: 수락됐습니다 팝업의 확인 버튼을 누른 뒤 결제를 기다리고 있어요, 계약 진행 중, 결제 대기, 계약 확정 등 승인 후 상태를 확인한다.
    expected: 게스트 결제가 가능한 상태가 된다.
validations:
  - id: APPROVE-HOST-V01
    description: 계약 관리 목록에서 계약 요청 카드가 없으면 FAIL 처리한다.
  - id: APPROVE-HOST-V02
    description: 상세 화면에서 계약 수락 버튼이 없으면 FAIL 처리한다.
  - id: APPROVE-HOST-V03
    description: 수락 후 승인 완료 상태가 확인되지 않으면 FAIL 처리한다.
artifacts:
  screenshots:
    - 실패 시점 화면만 저장한다.
  logs:
    - host-contract-list.xml
    - contract-approve-detail.xml
    - contract-approve-after-tap.xml
    - contract-approve-final.xml
pass_criteria:
  - 계약 요청 상태의 계약 건을 선택한다.
  - 계약 수락 버튼을 누른다.
  - 수락됐습니다 팝업의 확인 버튼을 누른다.
  - 승인 후 결제 대기/계약 진행 상태를 확인한다.
