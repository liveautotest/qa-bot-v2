id: TC-LOGIN-001
name: 호스트 로그인
platform: aos
env: staging
role: host
slack_command: "!호스트 로그인"
runner:
  test: login
  implementation: src/tests/login.test.js
preconditions:
  - ADB_HOST_DEVICE 단말이 연결되어 있어야 한다.
  - 스테이징 앱이 단말에 설치되어 있어야 한다.
  - HOST_EMAIL, HOST_PASSWORD가 .env에 설정되어 있어야 한다.
  - 로그인 테스트는 앱을 완전히 종료한 뒤 재실행해서 시작한다.
steps:
  - id: LOGIN-HOST-01
    action: wake_device
    description: 단말 화면을 깨우고 잠금 해제를 시도한다.
    expected: 앱 조작이 가능한 상태가 된다.
  - id: LOGIN-HOST-02
    action: force_stop_and_launch_app
    description: 스테이징 앱을 완전히 종료한 뒤 다시 실행한다.
    expected: 스테이징 앱 첫 화면 또는 기존 세션 홈 화면이 노출된다.
  - id: LOGIN-HOST-03
    action: check_existing_session
    description: 이미 로그인된 홈 화면인지 확인한다.
    expected: 이미 로그인 상태면 호스트모드 확인 단계로 이동한다.
  - id: LOGIN-HOST-04
    action: tap_login_entry
    description: 이메일/휴대폰 번호로 시작하기 버튼을 누른다.
    expected: 이메일/비밀번호 입력 화면으로 이동한다.
  - id: LOGIN-HOST-05
    action: input_email
    description: 호스트 계정 이메일을 입력한다.
    expected: 이메일 입력값이 화면 XML에 반영된다.
  - id: LOGIN-HOST-06
    action: input_password
    description: 호스트 계정 비밀번호를 입력한다.
    expected: 비밀번호 필드는 마스킹 상태로 표시된다.
  - id: LOGIN-HOST-07
    action: submit_login
    description: 로그인 버튼을 누른다.
    expected: 로그인 요청이 제출된다.
  - id: LOGIN-HOST-08
    action: open_my_info_tab
    description: 로그인 후 내 정보 탭으로 이동한다.
    expected: 내 정보 화면이 노출된다.
  - id: LOGIN-HOST-09
    action: tap_host_mode
    description: 호스트모드 버튼을 누른다.
    expected: 호스트모드 화면 또는 호스트 상태가 확인된다.
validations:
  - id: LOGIN-HOST-V01
    description: 로그인 실패 문구가 보이면 FAIL 처리한다.
  - id: LOGIN-HOST-V02
    description: 로그인 제출 후 홈 화면 신호가 없으면 FAIL 처리한다.
  - id: LOGIN-HOST-V03
    description: 호스트 계정은 내 정보 탭에서 호스트모드 버튼까지 확인되어야 PASS 처리한다.
  - id: LOGIN-HOST-V04
    description: 비밀번호 입력 필드 마스킹 여부를 확인한다.
artifacts:
  screenshots:
    - after-launch.png
    - after-login-entry.png
    - final.png
    - host-mode.png
  logs:
    - runner.log
    - after-launch.xml
    - after-submit.xml
    - host-my-info.xml
    - host-mode.xml
pass_criteria:
  - 홈 화면이 확인된다.
  - 내 정보 탭에서 호스트모드 버튼 또는 호스트 상태가 확인된다.
  - 로그인 실패 문구가 없다.
  - 리포트 디렉토리가 생성된다.
