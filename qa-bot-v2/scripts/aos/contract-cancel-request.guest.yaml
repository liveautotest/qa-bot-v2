id: TC-CONTRACT-CANCEL-REQUEST-001
name: 게스트 계약 요청 취소
platform: aos
env: staging
role: guest
slack_command: "!게스트 계약 요청 취소"
runner:
  test: contract-cancel-request
  implementation: src/tests/contract-cancel-request.test.js
preconditions:
  - ADB_GUEST_DEVICE 단말이 연결되어 있어야 한다.
  - 대상 앱이 단말에 설치되어 있어야 한다.
  - 게스트 계정으로 로그인되어 있어야 한다.
  - 홈 화면에 계약 요청, 요청 중, 수락 대기 상태의 취소 가능한 카드가 있어야 한다.
steps:
  - id: CANCEL-REQUEST-01
    action: wake_device
    description: 단말 화면을 깨우고 잠금 해제를 시도한다.
    expected: 앱 조작이 가능한 상태가 된다.
  - id: CANCEL-REQUEST-02
    action: force_stop_and_launch_app
    description: 앱을 완전히 종료한 뒤 다시 실행한다.
    expected: 게스트 홈 화면이 노출된다.
  - id: CANCEL-REQUEST-03
    action: pull_to_refresh_home
    description: 홈 화면을 풀 리프레시한다.
    expected: 계약 요청 상태 카드가 노출된다.
  - id: CANCEL-REQUEST-04
    action: open_contract_detail
    description: 계약 요청 상태 카드를 선택한다.
    expected: 계약 상세 화면으로 이동한다.
  - id: CANCEL-REQUEST-05
    action: scroll_to_cancel_button
    description: 계약 상세 화면 최하단으로 빠르게 스크롤한다.
    expected: 계약 취소 버튼이 노출된다.
  - id: CANCEL-REQUEST-06
    action: tap_cancel_contract
    description: 계약 취소 버튼을 선택한다.
    expected: 계약 취소 사유 선택 화면으로 이동한다.
  - id: CANCEL-REQUEST-07
    action: select_cancel_reason
    description: 기타를 제외한 취소 사유 4개 중 하나를 랜덤 선택한다.
    expected: 계약 취소 버튼이 활성화된다.
  - id: CANCEL-REQUEST-08
    action: submit_cancel_request
    description: 활성화된 계약 취소 버튼을 선택한다.
    expected: 계약 요청 취소 완료 상태 또는 홈 복귀 상태가 확인된다.
validations:
  - id: CANCEL-REQUEST-V01
    description: 홈 화면에서 계약 요청 상태 카드를 찾지 못하면 FAIL 처리한다.
  - id: CANCEL-REQUEST-V02
    description: 계약 상세 하단의 계약 취소 버튼을 찾지 못하면 FAIL 처리한다.
  - id: CANCEL-REQUEST-V03
    description: 취소 사유 선택 후 계약 취소 버튼이 활성화되지 않으면 FAIL 처리한다.
  - id: CANCEL-REQUEST-V04
    description: 계약 요청 취소 완료 상태를 확인하지 못하면 FAIL 처리한다.
artifacts:
  screenshots:
    - 실패 시점 화면만 저장한다.
  logs:
    - cancel-request-home-after-refresh.xml
    - cancel-request-detail-start.xml
    - cancel-request-reason-start.xml
    - cancel-request-after-submit.xml
pass_criteria:
  - 홈 화면에서 계약 요청 상태 카드를 선택한다.
  - 계약 상세 하단의 계약 취소 버튼을 선택한다.
  - 기타 제외 취소 사유를 선택한다.
  - 계약 요청 취소 완료 상태 또는 홈 화면 복귀가 확인된다.
