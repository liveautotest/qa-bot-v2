id: TC-CONTRACT-REJECT-001
name: 호스트 계약 요청 거절
platform: aos
env: staging
role: host
slack_command: "!호스트 계약 요청 거절"
runner:
  test: contract-reject
  implementation: src/tests/contract-approve.test.js
preconditions:
  - ADB_HOST_DEVICE 단말이 연결되어 있어야 한다.
  - 대상 앱이 단말에 설치되어 있어야 한다.
  - 호스트 계정으로 로그인되어 있고 호스트모드 계약 탭에 진입 가능해야 한다.
  - 게스트가 계약 요청을 완료한 상태여야 한다.
  - 게스트 계약 요청 결과의 홈 카드 숙소명/일정과 호스트 계약 탭 계약 요청 카드의 숙소명/일정이 일치하는 건을 우선 처리한다.
steps:
  - id: REJECT-HOST-01
    action: wake_device
    description: 단말 화면을 깨우고 잠금 해제를 시도한다.
    expected: 앱 조작이 가능한 상태가 된다.
  - id: REJECT-HOST-02
    action: force_stop_and_launch_app
    description: 대상 앱을 완전히 종료한 뒤 다시 실행한다.
    expected: 호스트모드 하단 탭이 노출된다.
  - id: REJECT-HOST-03
    action: open_contract_tab
    description: 호스트모드 하단 계약 탭으로 이동한다.
    expected: 계약 관리 목록이 노출된다.
  - id: REJECT-HOST-04
    action: match_contract_request_card
    description: 최신 게스트 계약 요청 결과의 숙소명/일정과 같은 계약 요청 카드를 찾는다.
    expected: 숙소명/일정이 일치하는 계약 요청 카드가 확인된다.
  - id: REJECT-HOST-05
    action: open_contract_detail
    description: 매칭된 계약 요청 카드를 선택한다.
    expected: 호스트 계약 요청 상세 화면으로 이동한다.
  - id: REJECT-HOST-06
    action: tap_reject
    description: 계약 요청 상세 화면 하단의 거절 버튼을 누른다.
    expected: 게스트에게 계약 요청 거절 사유를 알려주세요 화면으로 이동한다.
  - id: REJECT-HOST-07
    action: select_reject_reason
    description: 드롭박스를 열고 기타를 제외한 4개 항목 중 하나를 랜덤 선택한다.
    expected: 거절 버튼을 누를 수 있는 상태가 된다.
  - id: REJECT-HOST-08
    action: submit_reject
    description: 하단 거절 버튼을 누른다.
    expected: 계약 요청 거절 완료 상태가 확인된다.
validations:
  - id: REJECT-HOST-V01
    description: 게스트 홈 카드 기준이 저장되어 있으면 숙소명/일정 일치 건을 우선 선택한다.
  - id: REJECT-HOST-V02
    description: 카드 기준이 없거나 일치 건을 찾지 못하면 호스트 계약 탭의 최신 계약 요청 건을 선택한다.
  - id: REJECT-HOST-V03
    description: 계약 상세 화면에 거절 버튼이 없으면 FAIL 처리한다.
  - id: REJECT-HOST-V04
    description: 거절 사유 화면 또는 거절 사유 항목을 찾지 못하면 FAIL 처리한다.
  - id: REJECT-HOST-V05
    description: 거절 완료 상태가 확인되지 않으면 FAIL 처리한다.
artifacts:
  screenshots:
    - 실패 시점 화면만 저장한다.
  logs:
    - host-contract-list.xml
    - host-contract-request-list.xml
    - contract-approve-detail.xml
    - contract-reject-reason-start.xml
    - contract-reject-final.xml
pass_criteria:
  - 게스트 홈 카드의 숙소명/일정과 같은 호스트 계약 요청 건을 우선 선택한다.
  - 매칭된 계약 요청 상세에서 거절 버튼을 누른다.
  - 기타를 제외한 거절 사유를 선택한다.
  - 계약 요청 거절 완료 상태가 확인된다.
